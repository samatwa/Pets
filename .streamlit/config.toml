[theme]
base = "light"
primaryColor = "#0c776b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f4"
textColor = "#172d2a"
borderColor = "#cddbd3"
linkColor = "#0c776b"
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["36px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "30px"
metricValueFontWeight = 600
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "0.5rem"
paddingBottom = "2rem"
chartCategoricalColors = ["#0c776b", "#6663ce", "#c9822e", "#487fa2", "#b15c92"]
dataframeHeaderBackgroundColor = "#edf4f0"
dataframeBorderColor = "#e4ebe7"

[browser]
gatherUsageStats = false
